function cards(items){return items.map(n=>`<article class="news-card"><div class="news-date">${fmt(n.date)}</div><div class="category">${esc(n.category)}</div><h3>${esc(n.title)}</h3><a class="text-link" href="#article/${encodeURIComponent(n.id)}">Читать материал <span>↗</span></a></article>`).join('')||'<div class="empty">Публикаций пока нет.</div>'}
function home(){return `${header()}<main><section class="hero"><div class="hero-image" role="img" aria-label="Иллюстративное изображение промышленного оборудования"></div><div class="wrap"><div class="hero-caption">ENGINEERING / INSPECTION / NDT</div><div class="hero-content"><div class="eyebrow">Белгазпромдиагностика</div><h1>Точность контроля.<br><span>Уверенность</span><br>в безопасности.</h1><p>Неразрушающий контроль и инженерная экспертиза для промышленных объектов.</p><div class="actions"><a class="btn" href="#home/services">Выбрать направление <span class="arrow">↗</span></a><a class="btn light" href="#home/contacts">Связаться с нами</a></div></div><div class="hero-bottom"><div><b>01 /</b><span>Техническая диагностика</span></div><div><b>02 /</b><span>Независимая инспекция</span></div><div><b>03 /</b><span>Подготовка специалистов</span></div></div></div></section><section class="section" id="services"><div class="wrap"><div class="section-head"><div><div class="label">01 / Направления работы</div><h2>Компетенции, на которые<br>можно опереться</h2></div><p>Выберите направление, чтобы узнать о возможностях компании и связаться со специалистом.</p></div><div class="services">${services.map((s,i)=>`<a class="service" href="#${s[2]}"><span class="num">0${i+1}</span><div><h3>${s[0]}</h3><p>${s[1]}</p></div><span class="arrow">↗</span></a>`).join('')}</div><div style="margin-top:22px;font-size:13px;color:var(--muted)">Другие направления: <a style="text-decoration:underline" href="#service/energy">энергетическое обследование зданий</a> · <a style="text-decoration:underline" href="#service/safety">средства индивидуальной защиты</a></div></div></section><section class="section about" id="about"><div class="wrap about-grid"><div class="about-copy"><div class="label">02 / Инженерный подход</div><h2>Видеть больше.<br>Принимать точные<br>решения.</h2><p>Команда работает с промышленными объектами в нефтехимии, энергетике и трубопроводном транспорте. Объединяем практический опыт и современные методы диагностики.</p><a class="text-link" href="#service">Возможности лаборатории <span>↗</span></a></div><div class="tech-panel"><div><div class="label">Собственная разработка</div><div class="tech-title">MSCAN<br>SUPOR<span style="color:#78aaff"> /</span></div><p>Механизированный ультразвуковой контроль сварных соединений с записью результатов.</p></div><div class="tech-tags"><span>TOFD</span><span>Ультразвуковой контроль</span></div></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="label">03 / Новости и обучение</div><h2>В фокусе компании</h2></div><a class="text-link" href="#news">Все публикации <span>↗</span></a></div><div class="news-grid">${cards(published().slice(0,3))}</div></div></section></main>${footer()}`}
const detail={inspection:['Инспекция третьей стороны','Контроль в области сварки и неразрушающих методов.'],certification:['Сертификация продукции','Подтверждение соответствия продукции техническим регламентам.'],training:['Обучение специалистов','Подготовка специалистов в области неразрушающего контроля.'],metrology:['Метрология','Поверка и калибровка резервуаров и трубопроводов.'],products:['Собственные разработки','Технологии и оборудование для задач технической диагностики.'],energy:['Энергетическое обследование зданий','Отдельное направление услуг компании.'],safety:['Средства индивидуальной защиты','Направление продукции компании.']};
function service(key){const v=detail[key];return `${header()}<main><div class="page-hero"><div class="wrap"><div class="breadcrumb"><a href="#home">Главная</a> / <a href="#home/services">Услуги</a> / ${v?'Направление':'Неразрушающий контроль'}</div><div class="label">${v?'Услуги компании':'Лаборатория и инженерная экспертиза'}</div><h1>${v?v[0]:'Неразрушающий<br>контроль и диагностика'}</h1><p>${v?v[1]:'Оценка технического состояния оборудования и конструкций. От выбора метода до результатов контроля.'}</p>${v?'':'<div class="pills"><span class="pill">Трубопроводы</span><span class="pill">Резервуары</span><span class="pill">Оборудование</span><span class="pill">Металлоконструкции</span></div>'}</div></div><section class="section"><div class="wrap detail-grid"><div class="detail-copy"><div class="label">${v?'Об услуге':'Что мы делаем'}</div><h2>${v?'Решение под вашу задачу':'Контроль на каждом<br>важном участке'}</h2><p>${v?'Обсудите со специалистом объект, требуемые работы и документацию. Подробный состав услуги переносится с действующего сайта после проверки актуальности.':'Помогаем оценить состояние объекта, выявить дефекты и определить дальнейшие действия. Подбираем методы с учётом задачи и особенностей оборудования.'}</p>${v?'<div class="notice">Пример внутренней страницы. Детальное содержание этого направления будет перенесено и согласовано на этапе разработки.</div>':'<ul class="checklist"><li>Диагностика оборудования и конструкций</li><li>Оценка остаточного ресурса</li><li>Разработка методик и программ контроля</li><li>Мониторинг технического состояния</li></ul><h2>Методы контроля</h2><div class="method-grid"><div class="method"><b>TOFD</b><p>Дифракционно-временной метод</p></div><div class="method"><b>PAUT</b><p>Метод фазированных решёток</p></div><div class="method"><b>UT</b><p>Ультразвуковой контроль</p></div><div class="method"><b>MFL</b><p>Магнитное сканирование</p></div></div>'}</div><aside class="side-card"><div class="label">Контакт по направлению</div><h3>${v?'Обсудим ваш запрос':'Специалисты лаборатории'}</h3><p>Расскажите об объекте и задаче — уточним необходимые работы.</p><a class="phone" href="tel:${v?'+375173160200':'+375173160203'}">${v?'+375 (17) 316-02-00':'+375 (17) 316-02-03'}</a>${v?'':'<a class="email" href="mailto:ndt@diag.by">ndt@diag.by</a>'}<a class="btn" href="${v?'tel:+375173160200':'mailto:ndt@diag.by'}">${v?'Позвонить':'Написать специалисту'} <span>↗</span></a><small>Минск, ул. Гусовского, 10</small></aside></div></section></main>${footer()}`}
function newsPage(){return `${header()}<main><section class="page-hero"><div class="wrap"><div class="breadcrumb"><a href="#home">Главная</a> / Новости</div><div class="label">Новости и события</div><h1>Знания. Опыт.<br>Развитие.</h1><p>Обучение, события и публикации компании.</p></div></section><section class="section"><div class="wrap"><div class="news-controls">${['Все','Компания','Обучение'].map(x=>`<button class="${filter===x?'selected':''}" onclick="filter='${x}';render(false)">${x}</button>`).join('')}</div><div class="news-grid">${cards(published().filter(n=>filter==='Все'||n.category===filter))}</div><p class="muted" style="font-size:12px;margin-top:34px">В концепции показаны архивные публикации. Даты сохранены.</p></div></section></main>${footer()}`}
function articlePage(n,preview=false){if(!n)return `${header()}<div class="blank-view">Материал не найден. <a href="#news">Вернуться к новостям</a></div>`;return `${header()}<main class="article"><a class="text-link" href="${preview?'#admin/edit/'+(editorId||'new'):'#news'}">← ${preview?'Вернуться в редактор':'Все публикации'}</a>${preview?'<div class="notice">Предпросмотр. Публикация ещё не размещена.</div>':''}<div class="label" style="margin-top:40px">${esc(n.category)} / ${fmt(n.date)}</div><h1>${esc(n.title)}</h1>${n.cover?`<img style="width:100%;max-height:430px;object-fit:cover;margin:28px 0" src="${esc(n.cover)}" alt="Обложка публикации">`:''}<div class="article-body">${esc(n.body)}</div>${n.archive?`<div class="notice">В макете — краткий пересказ архивного анонса. Полный текст и вложения переносятся на этапе разработки.<br><a style="text-decoration:underline" href="${esc(n.source)}" target="_blank" rel="noopener">Посмотреть исходный сайт ↗</a></div>`:''}</main>${footer()}`}
function adminShell(content){return `<div class="admin"><aside class="admin-side">${brand}<div class="side-label">Управление сайтом</div><a class="item" href="#admin">▤ &nbsp; Новости</a><a class="back-site" href="#home">Перейти на сайт ↗</a><div class="account">Редактор сайта<small>Демонстрационный режим</small></div></aside><main class="admin-main">${content}</main></div>`}
function adminList(){return adminShell(`<div class="admin-top"><div><span class="demo-badge">Демо · данные только в этом браузере</span><h1>Новости</h1><p>Публикуйте материалы и обновляйте информацию самостоятельно.</p></div><a class="btn" href="#admin/edit/new">+ Добавить новость</a></div><div class="panel"><table class="admin-table"><thead><tr><th>Публикация</th><th>Статус</th><th>Дата</th><th></th></tr></thead><tbody>${[...news].sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<tr><td class="title-cell">${esc(n.title)}<div style="color:#738398;font-size:12px;margin-top:7px">${esc(n.category)}</div></td><td><span class="status ${n.status==='draft'?'draft':''}">${n.status==='draft'?'Черновик':'Опубликовано'}</span></td><td>${fmt(n.date)}</td><td><a class="edit-btn" href="#admin/edit/${encodeURIComponent(n.id)}">Редактировать</a></td></tr>`).join('')}</tbody></table></div><div class="notice">Это интерактивный прототип: изменения видны только здесь. Для рабочего сайта предусмотрены вход редактора и постоянное хранение публикаций.</div>`)}
function editor(id){editorId=id==='new'?null:id;let n=previewData&&previewData.id===(editorId||'new')?previewData:news.find(x=>x.id===id)||{title:'',body:'',date:new Date().toISOString().slice(0,10),category:'Компания',cover:''};cover=n.cover||'';return adminShell(`<div class="admin-top"><div><a class="muted" style="font-size:13px" href="#admin">← Все новости</a><h1>${editorId?'Редактирование новости':'Новая публикация'}</h1><p>Добавьте текст, выберите дату и сохраните материал.</p></div><span class="demo-badge">Демонстрационный редактор</span></div><form id="editor-form" onsubmit="event.preventDefault();saveNews('published')"><div class="editor-layout"><div class="panel"><label class="field">Заголовок<input id="news-title" required maxlength="160" value="${esc(n.title)}" placeholder="Введите название новости"></label><label class="field">Текст публикации<textarea id="news-body" required placeholder="Расскажите о событии…">${esc(n.body)}</textarea><span class="help">Абзацы и переносы строк сохраняются.</span></label><label class="field">Обложка<input type="file" accept="image/jpeg,image/png,image/webp" onchange="setCover(this)"><span class="help">JPG, PNG или WebP, до 1 МБ в демо.</span></label><img id="cover-preview" class="cover-preview" ${cover?`src="${esc(cover)}"`:'hidden'} alt="Обложка публикации"><button class="edit-btn" type="button" onclick="cover='';$('#cover-preview').hidden=true">Убрать обложку</button></div><aside><div class="panel"><h2>Публикация</h2><label class="field">Дата<input id="news-date" type="date" required value="${esc(n.date)}"></label><label class="field">Категория<select id="news-category"><option ${n.category==='Компания'?'selected':''}>Компания</option><option ${n.category==='Обучение'?'selected':''}>Обучение</option></select></label><div class="actions"><button class="btn" type="submit">${n.status==='published'?'Сохранить изменения':'Опубликовать'}</button><button class="btn secondary" type="button" onclick="saveNews('draft')">Сохранить черновик</button><button class="btn secondary" type="button" onclick="previewNews()">Предпросмотр ↗</button></div><p>В демо публикация появится в разделе новостей этого прототипа.</p></div></aside></div></form>`)}
function data(){return {id:editorId||'new',title:$('#news-title').value.trim(),body:$('#news-body').value.trim(),date:$('#news-date').value,category:$('#news-category').value,cover}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,5000)}
function previewNews(){if(!$('#editor-form').reportValidity())return;previewData=data();location.hash='preview'}
function saveNews(status){if(!$('#editor-form').reportValidity())return;let n=data();if(!n.title||!n.body){toast('Добавьте заголовок и текст.');return}const old=news.find(x=>x.id===editorId);if(old?.archive){n.archive=true;n.source=old.source}n.id=editorId||'post-'+Date.now();n.status=status;let next=editorId?news.map(x=>x.id===editorId?n:x):[n,...news];try{localStorage.setItem('diag-design-news-v1',JSON.stringify(next))}catch{toast('Не удалось сохранить: разрешите локальное хранение или уменьшите обложку.');return}news=next;previewData=null;location.hash='admin';toast(status==='draft'?'Черновик сохранён в демо.':'Публикация сохранена в демо. Изменения видны в разделе «Новости».')}
function setCover(input){let f=input.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>1048576){toast('Выберите JPG, PNG или WebP до 1 МБ.');input.value='';return}let r=new FileReader();r.onload=()=>{cover=r.result;$('#cover-preview').src=cover;$('#cover-preview').hidden=false};r.readAsDataURL(f)}
function render(scroll=true){let raw=location.hash.slice(1)||'home';let [page,sub,id]=raw.split('/');let html=page==='home'?home():page==='service'?service(sub):page==='news'?newsPage():page==='article'?articlePage(news.find(x=>x.id===decodeURIComponent(sub||''))):page==='admin'?(sub==='edit'?editor(decodeURIComponent(id||'new')):adminList()):page==='preview'?articlePage(previewData,true):home();$('#app').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(a=>a.classList.toggle('active',a.dataset.tab===(page==='article'?'news':page==='preview'?'admin':page)));if(scroll){window.scrollTo(0,0);if(page==='home'&&sub)requestAnimationFrame(()=>document.getElementById(sub)?.scrollIntoView())}}
window.addEventListener('hashchange',()=>render());render();
</script></body></html>
